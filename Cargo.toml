[workspace]
resolver = "2"
members = [
    "rusty-grep",
    "rusty-api",
    "rusty-queue",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Essence Xalor Imperion"]
license = "MIT"
repository = "https://github.com/VoidEngineX/Imperion-Ascent-Forge"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
